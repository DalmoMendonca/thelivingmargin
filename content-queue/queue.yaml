  - id: 2026-04-25-attention-has-texture
    createdAt: 2026-04-25T06:11:38.043Z
    source: ai
    slotPreference: midday
    kind: single
    templateFamily: editorial
    palette: emberParchment
    title: Attention Has Texture
    topic: quality of attention vs quantity of input
    angle: Argues that the texture of attention matters more than the volume of
      information—coarse attention misses meaning, fine attention finds it.
    fingerprint: argues attention coarse finds fine has information input matters
      meaning misses more quality quantity texture than volume vs
    voiceMode: contrarian
    quoteAttribution: ""
    altText: A warm, editorial single-image post with the headline about attention’s
      texture and a short body text contrasting coarse and fine attention.
    single:
      headline: Attention Has Texture
      body: >-
        Most people optimize for volume: more books, more tabs, more takes.
        That’s coarse attention—fast, wide, and mostly skimming the rind.


        Fine attention is slow, narrow, and abrasive enough to reveal grain. It
        doesn’t consume more; it renders more.


        If your attention is smooth, nothing sticks. If it has edges, meaning
        catches.
      supportLine: You don’t need more input. You need sharper noticing.
      footer: Texture beats volume.
    caption:
      hook: You can drown in data and still be thirsty for meaning.
      body: Quantity of input is the wrong race. Coarse attention treats ideas like
        headlines; fine attention treats them like wood—something you plane
        until the figure appears. Sharpen the edges of how you look, not the
        size of what you look at. The feed rewards throughput; your mind rewards
        texture.
      callToComment: Where do you practice fine attention—and where do you still skim?
      hashtags:
        - "#attention"
        - "#thinking"
        - "#learning"
        - "#depth"
        - "#craft"
        - "#essay"
    publishAttempts: 0
    status: ready
  - id: 2026-04-25-memory-over-metrics
    createdAt: 2026-04-25T06:11:43.696Z
    source: ai
    slotPreference: evening
    kind: single
    templateFamily: editorial
    palette: emberParchment
    title: Memory Over Metrics
    topic: The limits of metrics in measuring meaningful work
    angle: Argues that what endures in culture is carried by memory, not
      dashboards—metrics steer, but memory crowns.
    fingerprint: argues but by carried crowns culture dashboards endures limits
      meaningful measuring memory metrics not over steer what work
    voiceMode: contrarian
    quoteAttribution: ""
    altText: "An editorial-style typographic poster with warm parchment tones
      reading: 'If it doesn’t live in memory, it doesn’t matter.' Minimalist
      layout with literary feel."
    single:
      headline: If it doesn’t live in memory, it doesn’t matter.
      body: Metrics can tell you what moved, not what stayed. Charts reward what is
        easy to count; culture remembers what is hard to forget.
      supportLine: Aim for recall, not just reach.
      footer: Let the graph advise you. Let memory decide you.
    caption:
      hook: Most work is optimized for dashboards that no one remembers.
      body: "Numbers are useful—they warn, compare, and steer. But the things that
        last hitch a ride in human memory: phrasing, scenes, gestures, textures.
        If your work vanishes the moment the tab closes, the metric lied about
        its importance. Make something that’s hard to shake, even when the chart
        is gone."
      callToComment: What’s one line, image, or moment you still remember—and why do
        you think it stuck?
      hashtags:
        - "#creativeprocess"
