  - id: 2026-04-25-standards-as-delay
    createdAt: 2026-04-25T17:24:47.599Z
    source: ai
    slotPreference: midday
    kind: single
    templateFamily: editorial
    palette: emberParchment
    title: Standards as delay
    topic: How “standards” can function as a postponement strategy
    angle: Sometimes what you call high standards is just the comfort of not having
      to produce an imperfect draft.
    fingerprint: as call can comfort delay draft function having high how imperfect
      just not postponement produce sometimes standards strategy what
    voiceMode: contrarian
    altText: Editorial quote-style graphic with the headline “Your standards might
      be delay,” followed by a short paragraph about judging yourself before
      you’ve made anything.
    single:
      headline: Your standards might be delay.
      body: If you wait to feel “good enough” before you start, you’ve defined success
        as permission, not output. Standards are useful when they guide
        revision; they’re just procrastination when they block the first
        attempt.
      supportLine: A draft is not a failure. It’s a tool.
      footer: Make something, then decide what deserves to stay.
    caption:
      hook: A lot of “disciplined people” are actually just delaying in better
        language.
      body: "What if your standards aren’t protecting the work but protecting your
        self-image? The first draft always looks worse than the idea—because
        it’s doing the one thing ideas can’t: exposing what’s missing. Revision
        is taste; avoidance just wears a tuxedo."
      callToComment: Where do you see standards turning into delay in your own process?
      hashtags:
