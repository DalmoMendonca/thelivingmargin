    palette: brassInk
    title: Memory As Editor
    topic: memory and judgment
    angle: Treat what you remember as an edit, not evidence—the mind keeps what
      flatters its story and cuts what complicates it.
    fingerprint: as complicates cuts edit editor evidence flatters its judgment
      keeps memory mind not remember story treat what
    voiceMode: sharp
    altText: A restrained editorial graphic with a bold headline about memory as an
      editor, set on a warm cream background with brass ink typography.
    single:
      headline: Memory keeps what flatters the story.
      body: Don’t trust recall like a witness; use it like a draft. What sticks isn’t
        proof—it’s preference that survived the cut.
      supportLine: Reconstruct, then verify.
      footer: Edit the memory before it edits you.
    caption:
      hook: Your memory is not a record; it’s an edit suite.
      body: We’re biased toward scenes that vindicate us and fade the ones that
        complicate us. That’s not corruption; it’s compression. The fix isn’t to
        distrust yourself forever—it’s to treat recall like a first draft and
        re-report the parts that feel too tidy. Ask for dates, costs, witnesses,
        and missing footage.
      callToComment: When has a checked fact contradicted the memory you were sure about?
