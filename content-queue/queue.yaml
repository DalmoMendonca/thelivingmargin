    altText: "Carousel: 6:52 p.m. lobby check-in. Slide 1 shows a red-beeping
      keycard scanner and a folded clipboard with wristbands beside a locked
      lobby door and rain-dark windows. Slide 2 shows a phone on an open
      confirmation email as the exact confirmation number is read; a label
      printer spits out a temporary badge. Slide 3 shows the temporary badge or
      wristband resting on a dark chair arm by the window, while the door
      remains closed but no longer feels like the whole problem."
