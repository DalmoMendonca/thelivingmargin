    single:
      headline: Saying no is a creative act.
      body: Most people add to improve. The sharper move is to subtract until what
        remains can’t be mistaken for anything else.
      supportLine: Refusal is design.
      footer: Keep the shape; lose the noise.
    caption:
      hook: Addition flatters effort; subtraction exposes intent.
      body: "‘Yes’ is cheap because it hides cost. ‘No’ makes a shape: it creates
        edges, priorities, and the conditions for taste to mean something. If
        your calendar, draft, or team can’t survive three serious nos, it’s not
        a plan—it’s a pile."
      callToComment: Where would one hard no clarify your week more than five soft yeses?
