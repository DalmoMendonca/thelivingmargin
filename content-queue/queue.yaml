  - id: 20260430043422-let-me-know-follow-ups
    createdAt: 2026-04-30T04:34:22.555Z
    source: ai
    slotPreference: midday
    kind: carousel
    templateFamily: notebook
    palette: sageAsh
    surfaceStyle: charcoalGrain
    title: Let-Me-Know Follow-Ups
    topic: follow-ups that turn into silence
    angle: If your message avoids the decision, people can’t respond without risking
      being wrong-so add a deadline and two usable options.
    fingerprint: add avoids being cant deadline decision follow if into know let me
      message options people respond risking silence so turn two ups usable
      without wrong
    contentMode: advice
    voiceMode: sharp
    altText: "Carousel about fixing vague follow-ups that invite silence. Slide 1
      shows “Let me know what works” after a meeting and labels it as
      open-ended. Slide 2 provides a decision+deadline+two-options template with
      an A/B reply permission line. Slide 3 gives a work-day scheduling example.
      Slide 4 covers the one-option edge case. Slide 5 gives a next-time rule:
      draft before you leave the meeting."
    carousel:
      - kicker: The trap
        headline: “Let me know what works” = safe-to-ignore.
        body: >-
          After the meeting, your Slack ends with: “Let me know what works.”


          It signals: no concrete ask, no cutoff, no wrong to be accountable
          for.
        footer: Open-ended = safe to ignore.
      - kicker: The fix
        headline: Decision + deadline + two usable options.
        body: "Confirm by Tue 3:00pm: Option A (X) or Option B (Y). No essay-reply A or
          B."
        footer: Choice. Then time.
      - kicker: Work-day example
        headline: Scheduling follow-up (quick reply).
        body: |-
          Option A: 1:30-2:00pm, Room 2.

          Option B: 2:00-2:30pm, call.

          Reply with A or B by Tue 3:00pm.
        footer: Two options a tired brain can pick.
      - kicker: Edge case
        headline: Only one option? Make the default explicit.
        body: |-
          I’ll proceed with Option A unless you tell me otherwise by Tue 3:00pm.

          If that’s wrong, send the correction by the same time.
        footer: Default + correction path-no meeting required.
      - kicker: Next time rule
        headline: Write the follow-up before you leave the meeting.
        body: Set the deadline and lock your A/B picks while details are still
          live-before you leave the meeting, not after lunch.
        footer: Draft first. Then send.
    caption:
      hook: Vague follow-ups become silence because the other person can’t answer
        safely.
      body: If you skip the decision, I’ll assume the default (usually your first
        option) after the cutoff. If you only have one option, say what you’ll
        do and request a correction by the same time.
      hashtags:
        - "#workcommunication"
