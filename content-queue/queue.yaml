    title: Genius Is Pacing
    topic: hidden role of rest in creative work
    angle: Argues that real progress happens in alternation—bursts of effort
      punctuated by deliberate idleness—not in continuous grind.
    fingerprint: alternation argues bursts by continuous creative deliberate effort
      genius grind happens hidden idleness not pacing progress punctuated real
      rest role work
    voiceMode: contrarian
    quoteAttribution: "null"
    altText: "Editorial-style single image with warm parchment palette: bold
      headline reading 'Work Rested, Not Relentless' and a short paragraph
      beneath, set in literary serif type on textured paper background."
    single:
      headline: Work Rested, Not Relentless
      body: The mind does its best lifting off the clock. Bursts make breakthroughs;
        idleness metabolizes them. Continuous grind looks brave and produces
        averages. The people who seem tireless usually excel at stopping early.
      supportLine: Pace is a skill, not a mood.
      footer: If you never step away, you’re rehearsing noise.
    caption:
      hook: Relentless isn’t reliable—paced is.
      body: Most “grind” is an alibi for not trusting incubation. Insight needs
        oxygen, not just hours. The top performers are not the hardest workers
        in a straight line; they are the best at punctuating effort with
        emptiness so the work can organize itself. That looks lazy to the clock
        and lethal to the problem.
      callToComment: Where do you deliberately stop so the work can keep going without you?
      hashtags:
        - "#creativeprocess"
        - "#deepwork"
        - "#craft"
        - "#contrarianwisdom"
        - "#restandwork"
