  - id: 20260426163218-the-padding-that-gets-you-ignored
    createdAt: 2026-04-26T16:32:18.297Z
    source: ai
    slotPreference: midday
    kind: carousel
    templateFamily: notebook
    palette: brassInk
    surfaceStyle: notebookCream
    title: The Padding That Gets You Ignored
    topic: Making a direct work ask without apology-padding
    angle: If you soften the request, you also soften the decision-so give the other
      person a clear yes/no and a deadline.
    fingerprint: also apology ask clear deadline decision direct gets give if
      ignored making no other padding person request so soften without work yes
    contentMode: advice
    voiceMode: sharp
    altText: 5-slide notebook-style carousel showing how apology-padding words turn
      work requests into non-answers, with a two-line deadline + A/B template,
      one Slack/email example, one verbal meeting example, and a 48-hour
      follow-up rule that specifies what to do next.
    carousel:
      - kicker: Slide 1
        headline: Padding turns asks into background noise
        body: >-
          If your message includes words like “just,” “quickly,” “when you have
          time/minute,” “whenever,” or “if possible,” you’ve offered an exit
          ramp.


          You’re not asking for a decision-you’re asking for permission to
          delay.
        footer: "Fix: deadline + A/B choice."
      - kicker: Slide 2
        headline: Use this 2-line template
        body: >-
          I need [deliverable] by [day, time].


          Can you do A ([what you want]) or B ([fallback])? Reply A or B by
          [same deadline].
        footer: Remove the soft words; keep the yes/no.
      - kicker: Slide 3
        headline: Async example (Slack/email)
        body: >-
          Hi-can you handle the Thursday deck updates?


          I need the finalized slide figures + sources by Thu 2:00pm. Can you do
          A: send updated slides by Thu 2:00pm, or B: confirm which 2 charts to
          cut? Reply A or B by Thu 2:00pm.
        footer: Clear choice = clearer routing.
      - kicker: Slide 4
        headline: Meeting example (verbal)
        body: |-
          For the deck, I need the final client intro language today.

          Option A: approve this version.

          Option B: send the exact edits by 4:00pm so I can update immediately.

          Which is it-A or B-by end of meeting?
        footer: No “we’ll see.” Close the loop.
      - kicker: Slide 5
        headline: No response after 48 hours?
        body: >-
          Send: “Following up on [deliverable]. A or B by [time]? B is my
          default if I don’t hear back.”


          If still no reply after 48 hours: create/update the workspace artifact
          for B (task in your tracker or updated doc), and timestamp it with
          “[done] as B on [date/time]”. Proceed on B.
        footer: Silence doesn’t pause your timeline.
    caption:
      hook: “When you have a minute” is polite-so it makes your ask optional.
      body: "Turn the request into a decision: I need [deliverable] by [day, time].
        Can you do A ([what you want]) or B ([fallback])? Reply A or B by [same
        deadline]."
      callToComment: Comment your deliverable + deadline and I’ll rewrite it into A/B
        in two lines.
      hashtags:
        - "#workplacewriting"
        - "#workcommunication"
