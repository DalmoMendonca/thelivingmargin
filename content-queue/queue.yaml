    voiceMode: contrarian
    altText: Warm editorial typographic poster with a sharp headline reading
      'Repetition Is Research' on textured parchment with subtle ink accents.
    single:
      headline: Repetition Is Research
      body: If you can’t make the same attempt ten times, you don’t have a
        question—you have a craving for novelty. Repetition isn’t busywork; it’s
        how variance shows its hand. Patterns don’t admit themselves to
        tourists.
      supportLine: Do it again so the noise can’t hide.
      footer: Stop optimizing for new; optimize for signal.
    caption:
      hook: Novelty flatters; repetition measures.
      body: We love the rush of new inputs because they spare us from confronting what
        our last attempt actually said. But without multiple passes, you can’t
        tell skill from luck, or signal from weather. Repetition isn’t
        conservative—it’s experimental design for humans. The point is not
        routine; it’s resolution.
      callToComment: Where has doing the same thing, again, finally told you the truth?
