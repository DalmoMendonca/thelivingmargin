  - source: manual
    slotPreference: morning
    kind: single
    templateFamily: highlight
    palette: bluePlaster
    surfaceStyle: plasterBlue
    title: Hope's Favorite Translation
    topic: dating and denial
    angle: People often call one-sided interest bad timing because the cleaner
      explanation would force them to change direction.
    contentMode: aphorism
    voiceMode: sharp
    altText: Blue plaster editorial card about calling someone busy because not
      interested would hurt more.
    single:
      headline: |-
        You keep calling them busy
        because [[not interested]]
        would rearrange your hope.
      body: Temporary language is how a lot of one-sided situations stay emotionally
        open.
      supportLine: Some confusion is borrowed optimism.
    caption:
      hook: A vague maybe can keep a door open longer than a clean no.
      body: That is why people reread the politeness and ignore the pattern.
        Uncertainty can feel gentler than truth while it is still collecting
        time.
      hashtags:
        - "#dating"
