  - id: 2026-04-25-the-cost-of-being-easy
    createdAt: 2026-04-25T17:24:38.015Z
    source: ai
    slotPreference: evening
    kind: single
    templateFamily: editorial
    palette: emberParchment
    title: The Cost of Being Easy
    topic: attention as a design problem
    angle: What people call “simplicity” is often just a product decision to remove
      friction before thought can begin.
    fingerprint: as attention before begin being call can cost decision design easy
      friction just often people problem product remove simplicity thought what
    voiceMode: contrarian
    altText: "Editorial quote-style graphic reading: “If something is easy to
      consume, ask what it’s protecting you from.” with warm paper textures and
      a fine rule line."
    single:
      headline: If it’s easy to consume, ask what it’s protecting you from.
      body: >-
        Some writing is clear. Some is clean. And some is engineered so you
        don’t have to work at all.


        When the message arrives pre-chewed, the only thing you’re really
        practicing is agreement.
      supportLine: Clarity is generosity; convenience is sedation.
      footer: "Tonight: choose the paragraph that makes you slow down."
    caption:
      hook: A lot of “digestible” content is just thought managed for you.
      body: >-
        Clarity helps comprehension. But when an idea comes effortless—no hard
        edges, no awkward questions—it may be protecting you from the parts that
        would change your mind.


        Try this: read one piece that costs you something (time, rereads,
        confusion), then notice what that cost bought you: precision, memory, or
        real disagreement.
      callToComment: What’s one “easy” idea you believed for years because it never
        asked you to think?
      hashtags:
        - "#literarythought"
        - "#attention"
        - "#criticalthinking"
        - "#writing"
        - "#intellectualcuriosity"
