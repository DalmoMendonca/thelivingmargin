    single:
      headline: Are you refusing or failing?
      body: >-
        Refusal feels clean: no draft, no witness, no dent in the image.
        [[Failure is noisy.]] It puts evidence on the table, breaks your neat
        story, and gives you a next move.


        If your “standard” keeps you from attempts you could survive, it isn’t a
        standard. It’s camouflage.
      supportLine: Refusal protects reputation; failure grows judgment.
      footer: Pick the mess that teaches.
    caption:
      hook: Some lives look polished because nothing is tested.
      body: Refusal keeps you safe from the record. Failure puts your claims in
        daylight. If you’re always “not quite ready,” you’re managing image, not
        improving craft. Standards are real when they demand contact with
        consequence.
      callToComment: Where do you call it a standard when it’s really a refusal?
