      endorsement rather than real input: the timing is already locked, the
      feedback allowed is cosmetic, and dissent gets recoded as tone or
      awkwardness. The final slide explains that the real ask is legitimacy, not
      collaboration."
    carousel:
      - kicker: Diagnostic
        headline: 3 signs the room wants your endorsement, not your input
        body: When "any thoughts?" shows up after the decision is already packaged and
          moving.
      - kicker: "1"
        headline: The timing is too late for real influence.
        body: The final deck is done. The calendar is already booked. Feedback gets
          requested after the plan has momentum, not while it can still change.
