    createdAt: 2026-04-25T22:35:52.681Z
    source: ai
    slotPreference: morning
    kind: single
    templateFamily: notebook
    palette: sageAsh
    surfaceStyle: notebookCream
    title: Proof of your priorities
    topic: priorities and procrastination
    angle: The task you keep bargaining with usually reveals the feeling you are
      protecting yourself from, not a mystery about motivation.
    fingerprint: about bargaining feeling from keep motivation mystery not
      priorities procrastination proof protecting reveals task usually yourself
    contentMode: question
    voiceMode: reflective
    altText: Notebook-style text card asking what feels hardest to do after you
      already know it matters.
    single:
      headline: What feels hardest to do—after you already know it matters?
      body: >-
        Not the thing you claim to believe.


        The thing your body keeps bargaining with.


        If you keep revising your reasons, you’re probably not searching for
        truth—you’re searching for relief.
      supportLine: "[[hardest to do]] is a data point."
      footer: Name the delay. Then decide what you’re protecting.
    caption:
      hook: Most “motivation problems” are preference problems with better branding.
      body: >-
        When you already know what matters, the remaining friction isn’t a
        mystery—it’s an agreement you haven’t admitted. Your attention, your
        avoidance, your quiet workarounds: that’s the real platform your day
        runs on.


        Try asking a narrower question: what are you trying not to feel by
        postponing this?
      callToComment: What’s a small task you keep justifying, even though the outcome
        matters to you?
      hashtags:
        - "#writing"
        - "#selfknowledge"
        - "#decisionmaking"
        - "#habits"
        - "#editorialnotes"
