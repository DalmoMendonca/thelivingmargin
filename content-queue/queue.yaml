  - id: 2026-04-26-warmth-and-presence
    createdAt: 2026-04-26T03:50:05.757Z
    source: manual
    title: Warmth and Presence
    topic: attention and care
    angle: Warmth can imitate care even when actual availability never arrives.
    fingerprint: actual arrives attention availability can care even imitate never
      presence warmth when
    publishAttempts: 0
    status: ready
    slotPreference: evening
    kind: single
    templateFamily: editorial
    palette: sageAsh
    surfaceStyle: plasterBlue
    contentMode: observation
    voiceMode: sharp
    altText: Editorial text card about the difference between warmth and real presence.
    single:
      headline: Warmth is not always presence.
      body: >-
        Some people know how to sound close without ever becoming available.


        You leave the conversation feeling held for twelve seconds and alone for
        the week.
      supportLine: Tone can imitate care.
      footer: Attention has a calendar.
    caption:
      hook: A gentle voice can still leave you carrying the whole relationship.
      body: This is what makes the dynamic confusing. Nothing feels obviously cold.
        The problem is not the temperature. It's the absence of weight-bearing
        contact.
      callToComment: What tells you the difference between warmth and reliability now?
      hashtags:
        - "#care"
        - "#relationships"
        - "#boundaries"
        - "#selfrespect"
  - id: 2026-04-26-private-rehearsal
    createdAt: 2026-04-26T03:50:05.757Z
    source: manual
    title: Private Rehearsal
    topic: character and habit
    angle: What you rehearse in private usually becomes your public face under stress.
    fingerprint: becomes character face habit private public rehearsal rehearse
      stress under usually what
    publishAttempts: 0
    status: ready
    slotPreference: evening
    kind: single
    templateFamily: signal
    palette: midnightPaper
    surfaceStyle: charcoalGrain
    contentMode: aphorism
    voiceMode: sharp
    altText: Dark textured quote card about private language turning into public
      character under stress.
    single:
      headline: What you rehearse in private becomes your face under stress.
      body: Character is often just your most practiced sentence arriving before your
        values do.
      supportLine: Private language builds public reflex.
      footer: Listen to what shows up when you're late, hurt, or cornered.
    caption:
      hook: People usually meet your habits before they meet your ideals.
      body: That is why the small private rehearsal matters. Not because it is
        dramatic, but because stress has a way of sending the deepest groove to
        the surface first.
      callToComment: What line do you hear yourself reaching for when pressure hits?
      hashtags:
        - "#character"
        - "#habits"
        - "#selfawareness"
        - "#mindset"
