    title: What I'll Try Means
    topic: ambiguity and commitment
    angle: A short exchange can expose the difference between warmth and commitment
      when one person relies on ambiguity.
    contentMode: dialogue
    voiceMode: reflective
    altText: Three-slide notebook carousel about how 'I'll try' can mean very
      different things in a relationship.
    carousel:
      - kicker: Kitchen
        headline: '"Are you still coming?"'
        body: |-
          'I said I'd try,' he said.

          That was the sentence she finally heard correctly.
        footer: Some ambiguity is policy.
      - kicker: Translation
        headline: "\"I'll try\" can mean two different things."
        body: |-
          One person hears hope.
          The other person has already protected their evening.
        footer: Warmth and commitment are not synonyms.
      - kicker: After
        headline: She stopped arguing with the wording.
        body: From then on, she listened for dates, not tone. It hurt less than guessing
          and ended sooner.
        footer: Clarity can feel colder than fantasy.
    caption:
      hook: A lot of painful relationships are built on sentences nobody translates in
        time.
      body: Language can divide responsibility very neatly. One person gets to sound
        kind.
