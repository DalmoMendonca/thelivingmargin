        headline: Input shows up after motion starts
        body: Calendar holds are out. Money is attached. Then comes the late "thoughts?"
      - kicker: What it is
        headline: The room is not choosing
        body: It is being asked to share ownership of a decision already in motion.
        footer: Rollout presented as discussion.
