    title: Improvement as Camouflage
    topic: self-improvement and avoidance
    angle: Self-improvement language can hide from exposure, feedback, and real
      attempts when it never risks embarrassment.
    contentMode: list
    voiceMode: sharp
    altText: Five-slide blue carousel listing signs that self-improvement has become
      image management instead of growth.
    carousel:
      - kicker: List
        headline: 5 signs your self-improvement plan is protecting you from being seen.
        body: Growth can be honest. It can also be the prettier cousin of avoidance.
        footer: The difference is contact.
      - kicker: Sign 1
        headline: You keep preparing for a conversation you could already have.
        body: Reading more about honesty can feel safer than saying one unpolished true
          sentence out loud.
        footer: Research is not always readiness.
      - kicker: Sign 2
        headline: You buy systems where feedback would be cheaper.
        body: A new routine can look productive while it quietly replaces exposure with
          equipment.
        footer: Tools can become camouflage.
      - kicker: Sign 3
        headline: You call it standards when you mean insulation.
        body: If the plan only counts once it can protect your image, the plan is
          serving fear first.
        footer: Perfection often has a bodyguard.
      - kicker: Turn
        headline: If improvement never risks embarrassment, it may be image management.
        body: Real growth usually includes a visible draft, an awkward ask, or a day you
          are seen mid-process.
        footer: The proof is contact, not vocabulary.
    caption:
      hook: Some glow-ups are just better-lit hiding places.
      body: Self-improvement becomes honest again the moment it touches a real
        attempt, a real witness, or a real consequence. Until then, a lot of it
        is beautifully organized delay.
      hashtags:
        - "#selfimprovement"
        - "#avoidance"
