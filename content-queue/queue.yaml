  - id: 2026-04-25-the-unpaid-obsession
    createdAt: 2026-04-25T17:24:52.527Z
    source: ai
    slotPreference: evening
    kind: single
    templateFamily: editorial
    palette: emberParchment
    title: The Unpaid Obsession
    topic: attention, taste, and the cost of choosing what to care about
    angle: "Treat the things you keep returning to as unpaid debts: they shape your
      mind more than your intentions do."
    fingerprint: about as attention care choosing cost debts do intentions keep mind
      more obsession returning shape taste than they things treat unpaid what
    voiceMode: sharp
    altText: "A warm, editorial Instagram graphic with the headline: “The things you
      return to are the tuition you keep paying.” and supporting text about
      attention and taste."
    single:
      headline: The things you return to are the tuition you keep paying.
      body: >-
        Not your goals. Not your resolutions. Your attention leaves receipts.


        If you circle the same idea, you’re not “stuck”—you’re training your
        taste, one unresolved question at a time.
      supportLine: Choose deliberately what you revisit.
      footer: A mind is built from return visits.
    caption:
      hook: Your interests aren’t vibes; they’re the curriculum you keep choosing.
      body: >-
        We love talking about intentions, but attention behaves like a ledger.
        The topics you return to—before you feel “ready,” after you’ve moved on
        from the original curiosity—are what your mind is actually rehearsing.


        So here’s the contrarian question: what if your “lack of progress” is
        really just insufficient commitment to follow the thread long enough to
        form taste?
      callToComment: What’s one thing you keep circling back to, and what do you think
        it’s teaching you?
      hashtags:
        - "#attention"
        - "#lifelonglearning"
        - "#literarythinking"
        - "#taste"
        - "#editorialwriting"
