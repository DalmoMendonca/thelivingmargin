    single:
      headline: |-
        Ease Makes You Smooth.

        Friction Gives You Shape.
      body: Comfort rounds edges until nothing catches. The work that resists you is
        the work that names you—because you must choose what to keep, what to
        cut, and what to endure. Smooth travels faster; shaped travels farther.
      supportLine: Choose the resistance that teaches, not the struggle that flatters.
      footer: Morning field note
    caption:
      hook: Most people optimize for glide when they actually need grip.
      body: "Ease feels like progress because it’s frictionless. But without
        resistance, nothing distinctive forms—only speed. The right kind of
        difficulty is a sculptor: it clarifies taste, builds stamina, and sets
        limits that reveal design. If everything slides, nothing holds."
      callToComment: Where has chosen friction improved your work—or where did ease
        quietly dull it?
