  - id: 2026-04-26-old-yeses
    createdAt: 2026-04-26T03:50:05.755Z
    source: manual
    title: Old Yeses
    topic: obligation and identity
    angle: A commitment can remain active long after the self who made it is gone.
    fingerprint: active after can commitment gone identity long made obligation old
      remain self who yeses
    publishAttempts: 1
    status: published
    slotPreference: morning
    kind: single
    templateFamily: highlight
    palette: bluePlaster
    surfaceStyle: plasterBlue
    contentMode: question
    voiceMode: reflective
    altText: Editorial wall card asking what obligations people still carry just
      because they once said yes.
    single:
      headline: What are you still carrying just because you [[said yes once]]?
      body: |-
        A promise can outlive its reason.

        Sometimes discipline is finishing.
        Sometimes it's admitting the job has changed.
      supportLine: Old yeses can become expensive furniture.
      footer: Which obligation needs to be re-chosen?
    caption:
      hook: Not every unfinished thing deserves your loyalty.
      body: Some obligations began as honesty and stayed as inertia. The useful
        question is not whether you can endure them. It's whether they still
        belong in the life you're actually building.
      callToComment: What's one commitment you need to re-choose instead of just carrying?
      hashtags:
        - "#selfknowledge"
        - "#decisionmaking"
        - "#boundaries"
        - "#writing"
        - "#growth"
    renderDir: docs/assets/posts/20260426-old-yeses
    renderedFiles:
      - docs/assets/posts/20260426-old-yeses/post.png
    instagramMediaId: "17983540304820724"
    publishedAt: 2026-04-26T03:50:47.675Z
  - id: 2026-04-26-clean-apology
    createdAt: 2026-04-26T03:50:05.757Z
    source: manual
    title: Clean Apology
    topic: conflict and accountability
    angle: A real apology is usually shorter than the defense that tries to keep
      innocence intact.
    fingerprint: accountability apology clean conflict defense innocence intact keep
      real shorter than tries usually
    publishAttempts: 3
    status: published
    slotPreference: morning
    kind: single
    templateFamily: editorial
    palette: emberParchment
    surfaceStyle: paperWarm
    contentMode: aphorism
    voiceMode: sharp
    altText: Warm paper quote card about how a clean apology is usually shorter than
      the defense.
    single:
      headline: A clean apology is shorter than the defense.
      body: If it takes three minutes to explain why you hurt them, you are probably
        trying to keep your innocence, not repair the damage.
      supportLine: Repair starts when the self-portrait stops speaking.
      footer: Some honesty only fits in one sentence.
    caption:
      hook: A lot of conflict survives because people want absolution more than
        repair.
      body: Explanation has its place. It just usually comes after the apology, not in
        its place. The first honest sentence is often the smallest one in the
        room.
      callToComment: What makes an apology feel complete to you?
      hashtags:
        - "#relationships"
        - "#accountability"
        - "#communication"
        - "#innerwork"
    renderDir: docs/assets/posts/20260426-clean-apology
    renderedFiles:
      - docs/assets/posts/20260426-clean-apology/post.png
