        Understanding isn’t more data. It’s the practiced habit of restoring
        what was removed: who said it, when, for whom, against what alternative,
        at what cost.
      supportLine: If it can’t survive its context, it isn’t knowledge—it’s a slogan.
      footer: "Test: before you agree or attack, name the missing conditions."
    caption:
      hook: Most bad takes are just context that never made it to the scene.
      body: We treat facts like trophies, then wonder why they don’t explain anything.
        The real work is reattaching conditions—time, tradeoffs, incentives, and
        alternatives. That’s not pedantry; it’s the difference between signal
        and slogan. You don’t need more sources—you need the muscle that
        stitches them back together.
      callToComment: What’s a claim you believed until you put its context back on?
