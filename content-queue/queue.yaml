  - source: manual
    slotPreference: evening
    kind: carousel
    templateFamily: notebook
    palette: bluePlaster
    surfaceStyle: plasterBlue
    title: Eleven Minutes
    topic: care and urgency
    angle: A small act of institutional mercy can matter for years when it prevents
      a hard day from becoming a permanent regret.
    contentMode: story
    voiceMode: reflective
    altText: Three-slide blue notebook story about a nurse helping a late visitor
      see his mother after surgery.
    carousel:
      - kicker: Hospital
        headline: He was ten minutes late for visiting hours.
        body: Still in paint-stained work clothes, holding a charger and a paper cup.
          'My mother had surgery this morning,' he said. 'She doesn't know where
          I am.'
        footer: The window had already closed.
      - kicker: Desk
        headline: The night nurse heard him from the desk.
        body: She looked at the clock, looked at his hands, and said, 'Give me two
          minutes.' She came back with a badge and walked him upstairs herself.
        footer: Some care arrives as a small rule bending.
      - kicker: After
        headline: He sat with his mother for eleven minutes.
        body: Long enough to plug in her phone, fix the blanket at her feet, and let her
          see his face before the medication pulled her back under. He cried in
          the elevator because someone refused to let eleven minutes become
          zero.
        footer: Mercy is often a small defiance.
    caption:
      hook: A lot of people remember the crisis. They never forget who made room
        inside it.
      body: Care does not always arrive as rescue. Sometimes it arrives as a person
        who knows exactly which rule can bend without breaking what matters.
      hashtags:
        - "#story"
        - "#kindness"
        - "#care"
        - "#writing"
    notes: Showcase fallback
    id: 20260426052908-eleven-minutes
