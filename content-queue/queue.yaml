    quoteAttribution: polished with no attribution
    altText: "Three-panel story: rainy clinic steps with a stroller wedged by the
      entrance rail and an appointment paper coming apart; a staff member
      confirms intake via the lobby intercom and writes directions on the back
      of a receipt; the recipient reaches the correct desk with the scribble
      still in hand as the helper steps away."
    carousel:
      - kicker: Rain + a dead phone
        headline: The address didn’t survive the day
        body: Clinic steps slick with rain. A stroller wedged by the entrance rail, and
          my phone stuck on “No Service.” My visitor badge form was half-inked
          when security asked for the right desk name-one I couldn’t pin down.
        footer: My paper kept tearing where my hands kept grabbing.
      - kicker: One interruption
        headline: They didn’t ask how I felt
        body: A staff member answered the lobby intercom, confirmed intake, then grabbed
          the back of my receipt. “Past the vending machines-Desk 7.” The pen
          kept moving like it was the most ordinary answer in the building.
        footer: They handed me the direction and nothing else.
      - kicker: Still rain on my sleeves
        headline: By the time I arrived, I could breathe
        body: I walked straight to Desk 7, receipt creased but holding. The rain cooled
          the back of my neck, and my fingers stopped worrying the torn edge.
          When I looked up, the helper was already stepping away-already gone
          from the moment I needed.
        footer: Just enough afterglow to keep going.
    caption:
      hook: It wasn’t comfort.
      body: "The help cost them a real interruption: a few seconds on the intercom and
        time to write me to the right desk. From me, it cost accepting the line
        on the paper and walking-no bargaining with the panic."
