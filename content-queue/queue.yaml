  - id: 20260430044017-brain-picking-container
    createdAt: 2026-04-30T04:40:17.668Z
    source: ai
    slotPreference: midday
    kind: single
    templateFamily: notebook
    palette: midnightPaper
    surfaceStyle: charcoalGrain
    title: Brain-Picking Container
    topic: Setting a time box for vague requests
    angle: If someone asks to “pick your brain” without a decision or deadline,
      they’re asking for your attention-so you offer a small, specific container
      instead.
    fingerprint: asking asks attention box brain container deadline decision if
      instead offer pick picking requests setting small so someone specific
      theyre time vague without
    contentMode: advice
    voiceMode: sharp
    altText: "Handwritten note on dark paper reading “pick your brain?” with a bold
      rule beneath: “Time box it. Name the decision.”"
    single:
      headline: Time box it. Name the decision.
      body: “I can do 10 minutes today-what decision do you need by the end of that
