  - id: 2026-04-25-taste-over-trivia
    createdAt: 2026-04-25T06:10:37.377Z
    source: manual
    slotPreference: morning
    kind: carousel
    templateFamily: editorial
    palette: emberParchment
    title: Taste Over Trivia
    topic: Why taste outperforms mere information
    angle: Being informed fills you; taste filters you.
    fingerprint: being fills filters information informed mere outperforms over
      taste trivia why
    voiceMode: contrarian
    quoteAttribution: |+
      
    altText: Five-slide editorial carousel arguing that cultivated taste is more
      valuable than being merely well-informed, with warm literary design.
    carousel:
      - kicker: Against Info Glut
        headline: Being informed is easy. Having taste is costly.
        body: News is free and endless. Taste requires selection, omission, and the
          nerve to stand by it.
      - headline: Information adds. Taste subtracts.
        body: You can stack facts forever. Taste says no—until the signal appears. Most
          people fear the no.
      - headline: Taste has skin in the game.
        body: If you choose, you can be wrong. If you collect, you’re never accountable.
          Curation risks reputation; accumulation hides it.
      - headline: Taste shapes time, not just takes it.
        body: Information occupies you. Taste orders your day, your shelf, your
          attention. It builds a spine for what you’ll ignore.
      - kicker: The Unpopular Ask
        headline: Read less. Care more. Return often.
        body: Pick a few living minds. Revisit. Compare. Commit. Let boredom disqualify,
          not novelty seduce.
        footer: Your taste is your algorithm.
    caption:
      hook: Information is abundant; taste is expensive.
      body: Facts are table stakes. What moves a life is the ability to refuse most of
        them and commit to a few. Taste isn’t snobbery—it’s the courage to be
        specific, to risk being wrong, and to build a spine for attention. If it
        can’t survive a reread, it didn’t deserve the first read.
      callToComment: Where do you practice subtraction—what do you stop reading, and why?
      hashtags:
        - "#taste"
        - "#attention"
        - "#curation"
        - "#thinking"
        - "#reading"
        - "#designofmind"
    publishAttempts: 0
    status: rendered
