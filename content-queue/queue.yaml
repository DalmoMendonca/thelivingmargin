  - id: 2026-04-25-taste-is-the-edit-not-the-dessert
    createdAt: 2026-04-25T17:24:30.210Z
    source: manual
    slotPreference: morning
    kind: carousel
    templateFamily: lesson
    palette: emberParchment
    title: Taste Is the Edit, Not the Dessert
    topic: Why taste matters more than being informed
    angle: Information tells you what happened; taste decides what matters, what
      belongs, and what you’ll keep repeating.
    fingerprint: being belongs decides dessert edit happened information informed
      keep matters more not repeating taste tells than what why youll
    voiceMode: contrarian
    altText: Five-slide carousel arguing that taste is the quality-control system
      for living and thinking, not a decorative preference.
    carousel:
      - kicker: Slide 1
        headline: Being informed is easy to counterfeit.
        body: You can collect facts the way some people collect tabs. Knowing looks like
          progress; organizing looks like personality.
      - kicker: Slide 2
        headline: Taste is the quality-control step.
        body: "It’s the internal editor that says: not that, not now, not for me.
          Without it, information just multiplies your noise."
      - kicker: Slide 3
        headline: Taste isn’t “preference.” It’s judgment.
        body: Preference is taste without consequences. Judgment shows up when you
          choose under uncertainty and still feel responsible for the choice.
      - kicker: Slide 4
        headline: A well-read person can still be uncurated.
        body: You can cite everything and still miss the point—because you never trained
          your sensitivity to what’s coherent, humane, and true-to-life.
      - kicker: Slide 5
        headline: Want a smarter life? Build taste.
        body: "Practice returning to fewer things with more care: the sentence that
          lands, the argument that holds, the artwork that keeps teaching you
          after the first hit."
    caption:
      hook: Most people think “more information” will make them wiser—but taste does
        the actual work.
      body: Information is raw material. Taste is how you shape it into meaning, and
        how you decide what you’ll protect from becoming clutter. I’d rather be
        slightly behind on facts than ahead on judgment.
      callToComment: "Where do you think taste comes from in your life: exposure,
        discipline, or taste for discomfort?"
      hashtags:
        - "#literarythinking"
        - "#tastematters"
        - "#lifelonglearning"
        - "#editorialmindset"
        - "#curation"
    publishAttempts: 0
    status: rendered
    notes: Seeded from manual idea idea-001
