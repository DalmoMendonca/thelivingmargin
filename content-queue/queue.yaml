  - source: manual
    slotPreference: evening
    kind: single
    templateFamily: editorial
    palette: emberParchment
    surfaceStyle: paperWarm
    title: Tuesday Is the Life
    topic: attention and ordinary life
    angle: A well-known line about days and lives becomes useful again when it is
      aimed at ordinary repetition instead of abstract admiration.
    contentMode: quote
    voiceMode: sharp
    quoteAttribution: Annie Dillard
    altText: Warm editorial card featuring a short Annie Dillard quote about days
      and lives with a pointed subline about Tuesday.
    single:
      headline: |-
        "How we spend our days is, of course,
        how we spend our lives."
      body: "- Annie Dillard"
      supportLine: People quote this line and still treat Tuesday like a loophole.
    caption:
      hook: Admiration is easy. Tuesday is the real biography.
      body: Most people agree with this quote in the abstract and then hand the
        ordinary hours to drift, resentment, and convenience. The life is
        usually hiding in the repeat, not the vow.
      hashtags:
        - "#quote"
