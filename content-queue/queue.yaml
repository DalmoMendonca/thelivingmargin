      - docs/assets/posts/2026-04-26-tuesday-advice/post.png
    instagramMediaId: "17923536960317884"
    publishedAt: 2026-04-26T15:13:19.328Z
  - id: 2026-04-26-busy-language
    createdAt: 2026-04-26T03:50:05.757Z
    source: manual
    title: Busy Language
    topic: intimacy and distance
    angle: People sometimes use the language of busyness to soften a choice they do
      not want to name.
    fingerprint: busy busyness choice distance do intimacy language name not people
      soften sometimes they use want
    publishAttempts: 1
    status: published
    slotPreference: midday
    kind: single
    templateFamily: broadside
    palette: brassInk
    surfaceStyle: vellumRose
    contentMode: observation
    voiceMode: reflective
    altText: Broadside-style text card reflecting on how people use busy language to
      soften distance.
    single:
      headline: At brunch, everyone said they were 'bad at texting.'
      body: >-
        Nobody sounded guilty. Just booked.


        We have learned to describe neglect with the language of inconvenience.


        Sometimes the problem is not modern life. Sometimes it's that we want
        intimacy on a schedule that protects us from it.
      supportLine: Busy can be true and still be a cover.
      footer: Some absences are logistical. Some are chosen.
    caption:
      hook: The friendliest distance usually arrives with a reasonable explanation.
      body: That is what makes it hard to name. Nobody is cruel enough to indict. The
        relationship just starts living on intentions instead of contact.
      callToComment: Where do you notice future plans replacing actual presence?
      hashtags:
        - "#friendship"
        - "#relationships"
        - "#attention"
        - "#modernlife"
    renderDir: docs/assets/posts/2026-04-26-busy-language
    renderedFiles:
      - docs/assets/posts/2026-04-26-busy-language/post.png
    instagramMediaId: "18114649333685159"
    publishedAt: 2026-04-26T18:10:40.020Z
  - id: 2026-04-26-future-tense-intimacy
    createdAt: 2026-04-26T03:50:05.757Z
    source: manual
    title: Future Tense Intimacy
    topic: friendship and distance
    angle: Some relationships survive by promising future closeness instead of
      spending present attention.
    fingerprint: attention by closeness distance friendship future instead intimacy
      present promising relationships some spending survive tense
    publishAttempts: 3
    status: published
    slotPreference: evening
    kind: single
    templateFamily: broadside
    palette: emberParchment
    surfaceStyle: paperWarm
    contentMode: story
    voiceMode: reflective
    altText: Warm paper story card about people using future tense to imitate closeness.
    single:
      headline: Some people use [[future tense]] the way others use touch.
      body: >-
        We'll do dinner soon.

        We should take a trip.

        Let's have a proper catch-up.


        Promise can simulate closeness for a long time when nobody asks it to
        become a date on the calendar.
      supportLine: Planned intimacy is still intimacy only when it lands.
      footer: Hope is not the same as contact.
    caption:
      hook: The loneliest conversations are sometimes the warmest ones.
      body: Nobody is absent enough to accuse. Nobody is present enough to lean on.
        The relationship survives on future language and borrowed feeling.
      callToComment: What phrase now makes you ask whether someone means it or just
        likes saying it?
      hashtags:
        - "#friendship"
        - "#loneliness"
        - "#relationships"
        - "#writing"
    renderDir: docs/assets/posts/20260426-future-tense-intimacy
    renderedFiles:
