    title: The Missing Detail
    topic: Embarrassment dissolves when you name the exact missing thing
    angle: The threshold doesn’t open for vague apologies-it opens when you offer
      one usable detail, no bargaining for forgiveness.
    fingerprint: apologies bargaining detail dissolves doesnt embarrassment exact
      forgiveness missing name no offer one open opens thing threshold usable
