    topic: how to spot a discussion that is really a pre-made decision
    angle: When one outcome already has language, logistics, and momentum, the
      "discussion" is usually a softer way to spread ownership.
    fingerprint: already decide decision discussion has how language logistics made
      momentum one outcome ownership pre pretending really softer spot spread
      usually way when
    contentMode: list
    voiceMode: sharp
    altText: "Five-slide carousel on a blue plaster background about spotting a
      discussion that is not really open. Slide 1 promises 3 signs the room is
      pretending to decide and frames them as tests: what is prepared, what is
      debatable, and what is already moving. Slide 2 says one option arrives
      fully dressed with an agenda deck, dates, numbers, copy, or a budget line
      while the others stay vague. Slide 3 says the only questions left are
      about rollout, wording, timing, and implementation, not whether to do it.
      Slide 4 says calendar holds, money, or prior promises are already attached
      before a late request for thoughts. Slide 5 concludes that the room is not
      choosing, but being asked to share ownership of a decision already in
      motion."
    carousel:
      - kicker: Diagnostic
        headline: 3 signs the room is pretending to decide
        body: Use these three tests when input is invited, but one outcome already feels
          settled.
        footer: Check what is prepared, what is debatable, and what is already moving.
      - kicker: Sign 1
        headline: One option arrives fully dressed
        body: It already has an agenda deck, dates, numbers, copy, maybe even a budget
          line. The other options are still sketches.
      - kicker: Sign 2
        headline: Only rollout is up for debate
        body: You can discuss timing, wording, and implementation questions. Not whether
          this should happen at all.
