      - kicker: No bargaining
        headline: The exact detail
        body: Your phone is open to the confirmation email. You don’t say “I think I’m
          on the list.” You read the confirmation number exactly. The label
          printer answers with a temporary badge.
      - kicker: Afterglow
        headline: A badge that fits
        body: The temporary badge settles on the edge of a dark chair arm by the window.
          The door is still closed. It’s just no longer the whole story.
    caption:
      hook: At 6:52 p.
      body: "I’d said plenty of sorrys before I said the one usable detail: the
        confirmation number from my email. The label printer found it. A
